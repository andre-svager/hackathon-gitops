name: Deploy Donation Service to Production

on:
  push:
    branches: [main]
    paths:
      - 'donation-service/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./donation-service
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/donation-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update image tag in GitOps repo
        uses: actions/checkout@v4
        with:
          repository: your-org/hackathon-gitops
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops

      - name: Update Helm values image tag
        working-directory: gitops/environments/production
        run: |
          IMAGE_TAG=${{ github.sha }}
          ECR_URL=$(aws ssm get-parameter --name /solidarytech/production/ecr/donation-service-url --query Parameter.Value --output text)
          sed -i "s|repository: .*|repository: $ECR_URL|" donation-service.yaml
          sed -i "s|tag: .*|tag: $IMAGE_TAG|" donation-service.yaml

      - name: Commit and push changes
        working-directory: gitops
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add environments/production/donation-service.yaml
          git commit -m "Update donation-service image tag to ${{ github.sha }}"
          git push
