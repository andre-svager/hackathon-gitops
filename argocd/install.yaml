# Argo CD is installed from the official upstream manifest in bootstrap.sh.
#
# The upstream manifest is applied with server-side apply because its CRDs are
# too large for kubectl's client-side last-applied annotation:
# https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
#
# Keep this file as the local installation reference. Do not apply it directly;
# run ../bootstrap.sh from the hackathon-gitops directory.
apiVersion: v1
