# Production values for volunteer-service

fullnameOverride: "volunteer-service"
replicaCount: 2

image:
  repository: 621996700064.dkr.ecr.us-east-1.amazonaws.com/donation-service
  pullPolicy: Always
  tag: b856c3e31330a7af387d43e95bf3df2ac2d070bd

service:
  type: LoadBalancer
  port: 80
  targetPort: 8083
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

serviceAccount:
  create: true
  name: volunteer-service

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

healthCheck:
  path: /health
  port: 8083
  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false

env:
  - name: PORT
    value: "8083"
  - name: AWS_REGION
    value: us-east-1
  - name: AWS_DYNAMODB_TABLE
    value: SolidaryTechVolunteers
  - name: OTEL_SERVICE_NAME
    value: volunteer-service

secretEnv:
  - secretName: volunteer-service-secrets
    secretKey: aws-access-key-id
    envVar: AWS_ACCESS_KEY_ID
  - secretName: volunteer-service-secrets
    secretKey: aws-secret-access-key
    envVar: AWS_SECRET_ACCESS_KEY
