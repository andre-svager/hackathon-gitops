# Production values for ngo-service

fullnameOverride: "ngo-service"
replicaCount: 2

image:
  repository: 621996700064.dkr.ecr.us-east-1.amazonaws.com/ngo-service
  pullPolicy: Always
  tag: e60493b1562c1151f334603af42fce50703ea46d

service:
  type: LoadBalancer
  port: 80
  targetPort: 8081
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

serviceAccount:
  create: true
  name: ngo-service

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

healthCheck:
  path: /health
  port: 8081

env:
  - name: PORT
    value: "8081"
  - name: OTEL_SERVICE_NAME
    value: ngo-service

externalSecret:
  enabled: true
  secretName: ngo-service-secrets
  data:
    - secretKey: database-url
      remoteRef:
        key: solidarytech/production/ngo-service/database-url
      envVar: DATABASE_URL
