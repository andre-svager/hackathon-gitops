# Production values for ngo-service

fullnameOverride: "ngo-service"
replicaCount: 2

image:
  repository: $(aws ssm get-parameter --name /solidarytech/production/ecr/ngo-service-url --query Parameter.Value --output text)
  pullPolicy: Always
  tag: $(git rev-parse --short HEAD)

service:
  type: LoadBalancer
  port: 80
  targetPort: 8081
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

serviceAccount:
  create: true
  name: ngo-service

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

healthCheck:
  path: /health
  port: 8081

env:
  - name: PORT
    value: "8081"
  - name: OTEL_SERVICE_NAME
    value: ngo-service

externalSecret:
  enabled: true
  secretName: ngo-service-secrets
  data:
    - secretKey: database-url
      remoteRef:
        key: solidarytech/production/ngo-service/database-url
      envVar: DATABASE_URL
