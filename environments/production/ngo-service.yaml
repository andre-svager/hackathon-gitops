# Production values for ngo-service

fullnameOverride: "ngo-service"
replicaCount: 2

image:
  repository: 621996700064.dkr.ecr.us-east-1.amazonaws.com/ngo-service
  pullPolicy: Always
  tag: 40f5a118accc1d9d7592bc9b863f29423e71816b

service:
  type: LoadBalancer
  port: 80
  targetPort: 8081
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

serviceAccount:
  create: true
  name: ngo-service

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

healthCheck:
  path: /health
  port: 8081
  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false

env:
  - name: PORT
    value: "8081"
  - name: OTEL_SERVICE_NAME
    value: ngo-service

secretEnv:
  - secretName: ngo-service-secrets
    secretKey: database-url
    envVar: DATABASE_URL
