apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts   # ← fix this line
    chart: opentelemetry-collector
    # Run: helm search repo open-telemetry/opentelemetry-collector
    # and put the latest version here before applying.
    targetRevision: "0.173.1"
    helm:
      valuesObject:
        # "deployment" = 1 pod total, cheapest option for hackathon traffic.
        # ("daemonset" would run 1 pod per node instead - only needed if
        # you're collecting host-level telemetry, not just app traces.)
        mode: deployment
        image:
          repository: otel/opentelemetry-collector-contrib
        config:
          exporters:
            datadog:
              api:
                key: ${env:DD_API_KEY}
          service:
            pipelines:
              traces:
                exporters: [datadog]
              metrics:
                exporters: [datadog]
        extraEnvs:
          - name: DD_API_KEY
            valueFrom:
              secretKeyRef:
                name: datadog-api-key
                key: api-key
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
