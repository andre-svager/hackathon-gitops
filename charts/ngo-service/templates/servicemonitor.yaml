{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ngo-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ngo-service.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "ngo-service.selectorLabels" . | nindent 6 }}
  endpoints:
  - port: http
    interval: {{ .Values.serviceMonitor.interval }}
    path: {{ .Values.serviceMonitor.path }}
{{- end }}
